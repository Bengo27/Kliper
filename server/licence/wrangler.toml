name = "clipgenie-licence"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
TRIAL_LIMIT = "3"
TRIALS_OPEN = "1"       # "0" = no more free trials (paid users keep working)
MIN_VERSION = "0"       # e.g. "0.2.0" = older copies must update first (2.x tester builds count as oldest)
TRIAL_WATERMARK = "1"   # "1" = trial videos get "Made with Clip Genie"
TRIAL_AI = "0"          # "0" = no AI features in the trial
BUY_URL = ""            # the payment page, once there is one
TRIAL_PRO = "1"         # "1" = Pro features free while the trial lasts
LATEST_VERSION = ""      # newest Clip Genie (older copies show "Update available")
UPDATE_URL = ""          # its download link
NOTICE = ""              # message shown at the top of every Clip Genie
BETA_OPEN = "1"         # "0" = kill switch: the beta is over (paid / owner keep working)
GUEST_OPEN = "1"        # "1" = "Continue without Twitch" allowed (trial counted per PC)
FREE_MODE = "1"         # "1" = Clip Genie is free: no limits, no trial mark, every feature on (the creator, 12 Nov)
AI_OPEN = "1"           # "1" = built-in AI on for everyone (only works once the OPENROUTER_KEY secret is set)
AI_DAILY = "150"        # most AI calls per user per day
AI_MODELS = "nvidia/nemotron-3.5-super-vl:free,google/gemma-4-31b-it:free,nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free"   # FREE ONLY: the server ignores any model without ":free"
# OPENROUTER_KEY is a secret: npx wrangler secret put OPENROUTER_KEY (never in this file, never on stream)
# TWITCH_CLIENT_ID and TWITCH_CLIENT_SECRET are secrets: npx wrangler secret put TWITCH_CLIENT_ID (and _SECRET)

[[d1_databases]]
binding = "DB"
database_name = "clipgenie-licence"
database_id = "YOUR-D1-DATABASE-ID"   # from: npx wrangler d1 create clipgenie-licence
