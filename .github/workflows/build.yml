# Builds "Kliper Setup <version>.exe" on a Windows runner:
#   Python 3.11 (embeddable) + the engine's packages + FFmpeg (BtbN, GPL build with libass/fribidi) + Inno Setup.
# Every push to main: the installer is attached to the run (Actions -> the run -> Artifacts).
# A tag like v0.1.0, or a commit message with [release]: the installer is also published as a GitHub Release
# (pre-release, tag v<PUBLIC_VERSION>-beta.<run number>).
name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PY_VER: "3.11.9"
      STAGE: ${{ github.workspace }}\stage\Kliper
    steps:
      - uses: actions/checkout@v4

      - name: Stage app and engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:STAGE | Out-Null
          Copy-Item -Recurse app "$env:STAGE\app"
          Copy-Item -Recurse engine "$env:STAGE\engine"
          Remove-Item -Force "$env:STAGE\engine\vendor.zip" -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse -Directory -Filter __pycache__ $env:STAGE | Remove-Item -Recurse -Force
          Copy-Item README.md, LICENSE "$env:STAGE\"

      - name: Python (embeddable) + packages
        shell: pwsh
        run: |
          $py = "$env:STAGE\python"
          Invoke-WebRequest "https://www.python.org/ftp/python/$env:PY_VER/python-$env:PY_VER-embed-amd64.zip" -OutFile py.zip
          Expand-Archive py.zip -DestinationPath $py
          # let the embedded Python use site-packages (pip installs there)
          $pth = Get-ChildItem "$py\python*._pth" | Select-Object -First 1
          (Get-Content $pth) -replace '^#\s*import site', 'import site' | Set-Content $pth
          Add-Content $pth "Lib\site-packages"
          Invoke-WebRequest "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py
          & "$py\python.exe" get-pip.py --no-warn-script-location
          & "$py\python.exe" -m pip install --no-warn-script-location -r requirements.txt
          # NVIDIA GPU speech-to-text (much faster on NVIDIA cards; ignored on other PCs)
          & "$py\python.exe" -m pip install --no-warn-script-location nvidia-cublas-cu12==12.9.2.10 nvidia-cudnn-cu12==9.27.0.42
          & "$py\python.exe" -c "import faster_whisper, cv2, numpy, onnxruntime, yt_dlp; print('packages ok')"

      - name: FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath fftmp
          $bin = Get-ChildItem -Recurse -Directory fftmp | Where-Object Name -eq bin | Select-Object -First 1
          New-Item -ItemType Directory -Force "$env:STAGE\ffmpeg\bin" | Out-Null
          Copy-Item "$($bin.FullName)\ffmpeg.exe", "$($bin.FullName)\ffprobe.exe" "$env:STAGE\ffmpeg\bin\"
          & "$env:STAGE\ffmpeg\bin\ffmpeg.exe" -hide_banner -filters | Select-String " ass "

      - name: Engine smoke test (imports + Hebrew scoring)
        shell: pwsh
        working-directory: ${{ env.STAGE }}\engine
        run: |
          & "$env:STAGE\python\python.exe" -c "import sys; sys.path.insert(0, '.'); from clipgenie import server, scoring, captions, transcribe, ai; print(len(scoring.SPOKEN), transcribe.model_id(None)); assert any(rx.match('אין מצב') for rx, w in scoring.SPOKEN)"

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DSrc="$env:STAGE" /O"$env:GITHUB_WORKSPACE\out" tools\installer\kliper.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: Kliper-Setup
          path: out/*.exe
          retention-days: 14

      - name: Release tag
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path engine\clipgenie\server.py -Pattern '^PUBLIC_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if ("$env:GITHUB_REF" -like "refs/tags/*") { $t = "$env:GITHUB_REF_NAME" } else { $t = "v$v-beta.$env:GITHUB_RUN_NUMBER" }
          "tag=$t" >> $env:GITHUB_OUTPUT
          "name=קליפר $v בטא (build $env:GITHUB_RUN_NUMBER)" >> $env:GITHUB_OUTPUT

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: out/*.exe
          generate_release_notes: true
          prerelease: true
